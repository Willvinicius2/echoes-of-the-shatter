name: cliente2d

on:
  pull_request:
    paths: ['godot/scripts2d/**', 'godot/addons/**', 'godot/.gdlintrc', 'godot/scenes2d/**', 'godot/data2d/**', 'godot/art2d/**', 'tools/build/**', 'godot/gdextension/**', 'godot/shatter_rogue.gdextension', 'ShatterCore/**', '.github/workflows/cliente2d.yml']
  push:
    branches: [master]
    paths: ['godot/scripts2d/**', 'godot/addons/**', 'godot/.gdlintrc', 'godot/scenes2d/**', 'godot/data2d/**', 'godot/art2d/**', 'tools/build/**', 'godot/gdextension/**', 'godot/shatter_rogue.gdextension', 'ShatterCore/**']
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1-stable

jobs:

  lint-gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: gdtoolkit (gdlint usa godot/.gdlintrc; também acusa erro de sintaxe)
        run: |
          pip install "gdtoolkit==4.*"
          cd godot && gdlint scripts2d

  extensao-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Compilar a GDExtension (ShatterCore + godot-cpp 4.4)
        run: |
          git clone --depth 1 -b godot-4.4-stable https://github.com/godotengine/godot-cpp "$RUNNER_TEMP/godot-cpp"
          cmake -S godot/gdextension -B build-ext -DCMAKE_BUILD_TYPE=Release -DGODOT_CPP_DIR="$RUNNER_TEMP/godot-cpp"
          cmake --build build-ext -j"$(nproc)"
          ls -la godot/gdextension/bin
      - uses: actions/upload-artifact@v4
        with:
          name: gdextension-linux
          path: godot/gdextension/bin/

  extensao-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Compilar a GDExtension (ShatterCore + godot-cpp 4.4)
        shell: bash
        run: |
          git clone --depth 1 -b godot-4.4-stable https://github.com/godotengine/godot-cpp "$RUNNER_TEMP/godot-cpp"
          cmake -S godot/gdextension -B build-ext -DGODOT_CPP_DIR="$RUNNER_TEMP/godot-cpp"
          cmake --build build-ext --config Release
          ls -la godot/gdextension/bin
      - uses: actions/upload-artifact@v4
        with:
          name: gdextension-windows
          path: godot/gdextension/bin/*.dll

  teste-headless:
    needs: extensao-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gdextension-linux
          path: godot/gdextension/bin
      - name: Baixar Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Montar projeto só com o cliente 2D (sem C#)
        run: |
          mkdir proj
          for d in scripts2d scenes2d data2d art2d gdextension addons; do ln -s "$PWD/godot/$d" "proj/$d"; done
          ln -s "$PWD/godot/shatter_rogue.gdextension" proj/shatter_rogue.gdextension
          python3 - <<'PY'
          import re
          s = open('godot/project.godot').read()
          s = s.replace('"4.7", "C#", "Forward Plus"', '"4.4", "Forward Plus"')
          s = re.sub(r'\[dotnet\]\n\nproject/assembly_name="[^"]*"\n\n', '', s)
          open('proj/project.godot', 'w').write(s)
          PY
      - name: CSV de dados com importador keep (sem isso o --import cai às vezes)
        run: tools/build/checar_csv_keep.sh
      - name: Importar e testar
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path proj --import
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path proj --script res://scripts2d/tools/test_2d.gd | tee saida.txt
          ! grep -q "FALHA\|SCRIPT ERROR" saida.txt
      - name: Estresse de horda (informativo, não reprova)
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --fixed-fps 60 --path proj --script res://scripts2d/tools/estresse_2d.gd -- 300 150 | tee estresse.txt || true
          { echo '### Estresse de horda (300 inimigos, headless)'; grep 'ms/quadro\|nos:' estresse.txt; } >> "$GITHUB_STEP_SUMMARY" || true

  corridas-bot:
    needs: extensao-linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gdextension-linux
          path: godot/gdextension/bin
      - name: Baixar Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
      - name: Montar projeto só com o cliente 2D (sem C#)
        run: |
          mkdir proj
          for d in scripts2d scenes2d data2d art2d gdextension addons; do ln -s "$PWD/godot/$d" "proj/$d"; done
          ln -s "$PWD/godot/shatter_rogue.gdextension" proj/shatter_rogue.gdextension
          python3 - <<'PY'
          import re
          s = open('godot/project.godot').read()
          s = s.replace('"4.7", "C#", "Forward Plus"', '"4.4", "Forward Plus"')
          s = re.sub(r'\[dotnet\]\n\nproject/assembly_name="[^"]*"\n\n', '', s)
          open('proj/project.godot', 'w').write(s)
          PY
      - name: Importar
        run: ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path proj --import
      - name: 6 corridas automáticas (bot)
        run: |
          ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --fixed-fps 600 --path proj --script res://scripts2d/tools/corridas_2d.gd -- 6 "$PWD/metricas" ${{ github.run_number }} | tee saida_bot.txt
          ! grep -q "SCRIPT ERROR" saida_bot.txt
      - name: Resumo do job
        if: always()
        run: cat metricas/metricas_corridas.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metricas-corridas
          path: metricas/

  export:
    needs: [extensao-linux, extensao-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gdextension-linux
          path: godot/gdextension/bin
      - uses: actions/download-artifact@v4
        with:
          name: gdextension-windows
          path: godot/gdextension/bin
      - name: Baixar Godot e export templates
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          curl -sSL -o tpz.zip https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpz.zip -d tpz
          mv tpz/templates ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Exportar Windows e Linux
        run: tools/build/build_2d.sh "$PWD/build" "$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
      - name: Conferir arquivos
        run: |
          test -s build/windows/EcosDosEstilhacos.exe
          test -s build/linux/EcosDosEstilhacos.x86_64
          ls -la build/*
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/linux/
