name: cliente2d

on:
  pull_request:
    paths: ['godot/scripts2d/**', 'godot/scenes2d/**', 'godot/data2d/**', 'godot/art2d/**', 'tools/build/**', '.github/workflows/cliente2d.yml']
  push:
    branches: [master]
    paths: ['godot/scripts2d/**', 'godot/scenes2d/**', 'godot/data2d/**', 'godot/art2d/**', 'tools/build/**']
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1-stable

jobs:
  teste-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Montar projeto só com o cliente 2D (sem C#)
        run: |
          mkdir proj
          for d in scripts2d scenes2d data2d art2d; do ln -s "$PWD/godot/$d" "proj/$d"; done
          python3 - <<'PY'
          import re
          s = open('godot/project.godot').read()
          s = s.replace('"4.7", "C#", "Forward Plus"', '"4.4", "Forward Plus"')
          s = re.sub(r'\[dotnet\]\n\nproject/assembly_name="[^"]*"\n\n', '', s)
          open('proj/project.godot', 'w').write(s)
          PY
      - name: Importar e testar
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path proj --import
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path proj --script res://scripts2d/tools/test_2d.gd | tee saida.txt
          ! grep -q "FALHA\|SCRIPT ERROR" saida.txt

  corridas-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Baixar Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
      - name: Montar projeto só com o cliente 2D (sem C#)
        run: |
          mkdir proj
          for d in scripts2d scenes2d data2d art2d; do ln -s "$PWD/godot/$d" "proj/$d"; done
          python3 - <<'PY'
          import re
          s = open('godot/project.godot').read()
          s = s.replace('"4.7", "C#", "Forward Plus"', '"4.4", "Forward Plus"')
          s = re.sub(r'\[dotnet\]\n\nproject/assembly_name="[^"]*"\n\n', '', s)
          open('proj/project.godot', 'w').write(s)
          PY
      - name: Importar
        run: ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path proj --import
      - name: 10 corridas automáticas (bot)
        run: |
          ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --fixed-fps 600 --path proj --script res://scripts2d/tools/corridas_2d.gd -- 10 "$PWD/metricas" ${{ github.run_number }} | tee saida_bot.txt
          ! grep -q "SCRIPT ERROR" saida_bot.txt
      - name: Resumo do job
        if: always()
        run: cat metricas/metricas_corridas.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metricas-corridas
          path: metricas/

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Baixar Godot e export templates
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          curl -sSL -o tpz.zip https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q tpz.zip -d tpz
          mv tpz/templates ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Exportar Windows e Linux
        run: tools/build/build_2d.sh "$PWD/build" "$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
      - name: Conferir arquivos
        run: |
          test -s build/windows/EcosDosEstilhacos.exe
          test -s build/linux/EcosDosEstilhacos.x86_64
          ls -la build/*
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/linux/
