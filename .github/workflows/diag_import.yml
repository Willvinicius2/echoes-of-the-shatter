name: diag-import
# Diagnóstico temporário do crash do --import (sai antes do merge).
on:
  pull_request:
    paths: ['.github/workflows/diag_import.yml']

jobs:
  ext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 -b godot-4.4-stable https://github.com/godotengine/godot-cpp "$RUNNER_TEMP/godot-cpp"
          cmake -S godot/gdextension -B build-ext -DCMAKE_BUILD_TYPE=Release -DGODOT_CPP_DIR="$RUNNER_TEMP/godot-cpp"
          cmake --build build-ext -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: ext
          path: godot/gdextension/bin/

  importar:
    needs: ext
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variante: [csv-traducao, csv-keep, csv-traducao-sem-ext]
        lote: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ext
          path: godot/gdextension/bin
      - name: Baixar Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
      - name: Variante
        run: |
          if [ "${{ matrix.variante }}" != "csv-keep" ]; then git checkout origin/master -- godot/data2d; fi
          grep -h '^importer' godot/data2d/*.csv.import | sort | uniq -c
          git add -A godot && git -c user.name=x -c user.email=x@x commit -qm variante || true
      - name: 15 importações limpas
        run: |
          set +e
          falhas=0
          for i in $(seq 1 15); do
            git clean -fdqx godot; git checkout -q -- godot
            rm -rf proj; mkdir proj
            for d in scripts2d scenes2d data2d art2d; do ln -s "$PWD/godot/$d" "proj/$d"; done
            if [ "${{ matrix.variante }}" != "csv-traducao-sem-ext" ]; then
              ln -s "$PWD/godot/gdextension" proj/gdextension
              ln -s "$PWD/godot/shatter_rogue.gdextension" proj/shatter_rogue.gdextension
            fi
            python3 - <<'PY'
          import re
          s = open('godot/project.godot').read()
          s = s.replace('"4.7", "C#", "Forward Plus"', '"4.4", "Forward Plus"')
          s = re.sub(r'\[dotnet\]\n\nproject/assembly_name="[^"]*"\n\n', '', s)
          open('proj/project.godot', 'w').write(s)
          PY
            ./Godot_v4.4.1-stable_linux.x86_64 --headless --path proj --import > imp.txt 2>&1; rc=$?
            if [ $rc -ne 0 ]; then falhas=$((falhas+1)); echo "::warning::rodada $i rc=$rc"; grep -B4 -A3 "double free\|corruption\|handle_crash\|Caller thread" imp.txt | head -30; fi
          done
          echo "RESULTADO ${{ matrix.variante }} lote ${{ matrix.lote }}: $falhas falhas em 15" | tee -a "$GITHUB_STEP_SUMMARY"
