# Jobs sob demanda (minuto de Windows conta em dobro na cota). Sem segredos, sem Unity.
name: manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-windows:
    name: core-windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Configurar
        run: cmake -S ShatterCore -B build -G "Visual Studio 17 2022" -A x64 -DSHATTER_WERROR=ON -DSHATTER_BUILD_SHARED=ON
      - name: Compilar
        run: cmake --build build --config Release --parallel
      - name: Testar
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Reunir DLL
        shell: bash
        run: |
          mkdir -p out
          find build -name shattercore.dll -path "*Release*" -exec cp {} out/ \;
          test -f out/shattercore.dll
          sha256sum out/shattercore.dll | tee out/shattercore.dll.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: shattercore-dll
          path: out/
          if-no-files-found: error

  bench:
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Configurar
        run: cmake -S ShatterCore -B build -DCMAKE_BUILD_TYPE=Release -DSHATTER_WERROR=ON -DSHATTER_BUILD_BENCH=ON
      - name: Compilar
        run: cmake --build build -j "$(nproc)" --target shattercore_bench
      - name: Rodar (falha se 12 h de expedição > 2 s)
        run: ./build/shattercore_bench
